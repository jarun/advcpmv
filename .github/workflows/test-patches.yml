name: Test patches

on:
  pull_request:
    paths:
      - '**/advcpmv-*-*.patch'
  push:
    branches: [master]
    paths:
      - '**/advcpmv-*-*.patch'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    name: Detect patches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.find.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: find
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Strict pattern: also rejects unsafe characters in file names.
          pattern='^[A-Za-z0-9._/-]*advcpmv-[0-9.]+-[0-9.]+\.patch$'

          if [ "$EVENT" = "pull_request" ]; then
            # Only patches added, modified, renamed or copied by the PR.
            files=$(git diff --name-only --diff-filter=AMRC "$BASE_SHA" "$HEAD_SHA" | grep -E "$pattern" || true)
          else
            # push / manual run: test every patch in the repository.
            files=$(git ls-files | grep -E "$pattern" || true)
          fi

          # Each entry: patch path, container image ("" = run on the runner) and CFLAGS.
          # Patches must build with a toolchain from their own era, not the newest one:
          # coreutils <= 8.28: gnulib needs glibc < 2.28, so build in an Ubuntu 18.04 container.
          # coreutils 8.30: the patch relies on -fcommon (GCC < 10 default), so also Ubuntu 18.04.
          # coreutils 9.8, 9.9: gnulib does not build with the newest GCC, so use the ubuntu-22.04 runner.
          matrix=$(printf '%s\n' "$files" | jq -R -s -c '
            def cfg($v):
              if   $v | test("^8\\.(1|2[0-8]|30)(\\.|$)")
                then {runner: "ubuntu-latest", image: "ubuntu:18.04", cflags: ""}
              elif $v | test("^9\\.[89]$")
                then {runner: "ubuntu-22.04", image: "", cflags: "-std=gnu17"}
              else {runner: "ubuntu-latest", image: "", cflags: "-std=gnu17"} end;
            split("\n") | map(select(length > 0) | . as $p
              | ($p | capture("-(?<v>[0-9.]+)\\.patch$").v) as $v
              | {patch: $p} + cfg($v))')
          echo "Patches to test: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.patch }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Parse patch file name
        id: parse
        env:
          PATCH_PATH: ${{ matrix.patch }}
        run: |
          # Expected name: advcpmv-<patch-version>-<coreutils-version>.patch
          name=$(basename "$PATCH_PATH")
          if [[ ! "$name" =~ ^advcpmv-([0-9.]+)-([0-9.]+)\.patch$ ]]; then
            echo "::error::Invalid patch name: $name"
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "coreutils=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"

      - name: Download coreutils ${{ steps.parse.outputs.coreutils }}
        env:
          VERSION: ${{ steps.parse.outputs.coreutils }}
        run: |
          url="https://ftp.gnu.org/gnu/coreutils/coreutils-${VERSION}.tar.xz"
          if ! curl -fsSL --retry 3 -o coreutils.tar.xz "$url"; then
            echo "::error::Could not download $url (does coreutils $VERSION exist?)"
            exit 1
          fi
          tar xf coreutils.tar.xz

      - name: Apply patch cleanly (no offset, no fuzz, no rejects)
        env:
          PATCH_PATH: ${{ matrix.patch }}
          PATCH_NAME: ${{ steps.parse.outputs.name }}
          VERSION: ${{ steps.parse.outputs.coreutils }}
        run: |
          cp "$PATCH_PATH" "coreutils-${VERSION}/$PATCH_NAME"
          cd "coreutils-${VERSION}"

          # -F0 makes any fuzz a failure; offsets are checked in the output below.
          if ! patch -p1 -F0 --no-backup-if-mismatch -i "$PATCH_NAME" | tee patch.log; then
            echo "::error::Patch failed to apply"
            exit 1
          fi

          if grep -Eq 'offset|fuzz|FAILED' patch.log; then
            echo "::error::Patch applied with offset/fuzz; regenerate it against coreutils ${VERSION}"
            exit 1
          fi

      - name: Build and test (host)
        if: matrix.image == ''
        env:
          EXTRA_CFLAGS: ${{ matrix.cflags }}
          # gnu17 avoids gnulib/configure problems with the default -std=gnu23 of newer GCC.
        run: .github/scripts/build-and-test.sh "coreutils-${{ steps.parse.outputs.coreutils }}"

      - name: Build and test (${{ matrix.image }} container)
        if: matrix.image != ''
        env:
          IMAGE: ${{ matrix.image }}
          EXTRA_CFLAGS: ${{ matrix.cflags }}
          VERSION: ${{ steps.parse.outputs.coreutils }}
        run: |
          # Old patches need a toolchain from their own era (gnulib of coreutils
          # <= 8.28 needs glibc < 2.28; the 8.30 patch needs GCC < 10), so
          # build and test inside an older distribution (Ubuntu 18.04). A plain
          # docker run is used (not "container:") because actions/checkout needs
          # a recent glibc for Node.js.
          docker build -t advcpmv-builder - <<EOF
          FROM $IMAGE
          ENV DEBIAN_FRONTEND=noninteractive
          RUN apt-get update && apt-get install -y --no-install-recommends \\
                build-essential ca-certificates util-linux xz-utils
          EOF
          docker run --rm --user "$(id -u):$(id -g)" --shm-size=512m \
            -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" \
            -w "$GITHUB_WORKSPACE" -e RUNNER_TEMP -e EXTRA_CFLAGS \
            advcpmv-builder .github/scripts/build-and-test.sh "coreutils-$VERSION"
